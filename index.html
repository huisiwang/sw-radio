<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="短波頻率查詢">
  <meta name="theme-color" content="#121417">
  <title>短波電台頻率查詢</title>

  <style>
    :root {
      --bg-color: #121417;
      --card-bg: #1c2026;
      --border-color: #2e3642;
      --text-main: #f0f3f6;
      --text-sub: #9ba8b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --freq-badge: #0f2e2e;
      --freq-color: #34d399;
      --warning-bg: #451a03;
      --warning-border: #b45309;
      --warning-text: #fde68a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 24px) 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
      padding-top: 8px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .filter-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
    }

    select {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      font-size: 16px;
      color: var(--text-main);
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ba8b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 18px;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .alert-banner {
      display: none;
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 500;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .list-title {
      font-size: 17px;
      font-weight: 700;
    }

    .list-count {
      font-size: 16px;
      color: var(--text-sub);
    }

    .station-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .station-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .station-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .station-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .station-meta {
      font-size: 16px;
      color: var(--text-sub);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-tag {
      background-color: #28303d;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 16px;
    }

    .freq-box {
      text-align: right;
      flex-shrink: 0;
    }

    .freq-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--freq-color);
      background-color: var(--freq-badge);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(52, 211, 153, 0.2);
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }

    .freq-unit {
      font-size: 16px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .more-filters {
        border-top: 1px solid var(--border-color);
        padding-top: 12px;
    }

    .more-filters summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--accent);
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        list-style: none;
    }

    .more-filters summary::-webkit-details-marker {
        display: none;
    }

    .more-filters summary::after {
        content: '⌄';
        color: var(--text-sub);
        font-size: 20px;
        transition: transform 0.18s ease;
    }

    .more-filters[open] summary::after {
        transform: rotate(180deg);
    }

    #advancedFilterCount {
        margin-left: auto;
        color: var(--text-sub);
        font-size: 16px;
        font-weight: 400;
    }

    .more-filters-content {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-top: 12px;
    }

    .exclude-filter {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .checkbox-label {
        min-height: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-sub);
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
    }

    .checkbox-label input[type='checkbox'] {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
    }

    #excludeInput {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: var(--bg-color);
        color: var(--text-main);
        font-size: 16px;
    }

    #excludeInput:focus {
        outline: none;
        border-color: var(--accent);
    }

    #excludeInput:disabled {
        cursor: not-allowed;
        opacity: 0.5;
    }

    .filter-hint {
        color: var(--text-sub);
        font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📻 短波頻率查詢</h1>
      <span class="subtitle" id="currentClock">目前時間：--:--</span>
      <span id="refreshBtn" class="subtitle" style="font-size:16px; padding:8px 16px; border:none; font-weight:600; text-decoration: underline;">🔄 重新整理</span>
    </header>

    <div class="filter-panel">
        <div class="form-group">
            <label for="timeSelect">時段篩選</label>
            <select id="timeSelect">
                <option value="AUTO">現在時間（自動匹配）</option>
                <option value="ALL">全部時段</option>
                <!-- 其餘整點時段由 app.js 動態建立：0000-0100 至 2300-2400 -->
            </select>
        </div>

        <div class="form-group">
            <label for="langSelect">語言</label>
            <select id="langSelect">
                <option value="ALL">全部語言</option>
            </select>
        </div>

        <div class="form-group">
            <label for="stationSelect">電台</label>
            <select id="stationSelect">
                <option value="ALL">全部電台</option>
            </select>
        </div>

        <details class="more-filters" id="moreFilters">
            <summary>＋ 更多篩選 <span id="advancedFilterCount" aria-live="polite"></span></summary>

            <div class="more-filters-content">
                <div class="form-group">
                    <label for="tagSelect">分類標籤</label>
                    <select id="tagSelect">
                        <option value="ALL">全部分類</option>
                        <!-- 宗教／外語／中文／DX追蹤等選項由 app.js 依 tags 動態建立 -->
                    </select>
                </div>

                <div class="exclude-filter">
                    <label class="checkbox-label" for="excludeEnabled">
                        <input id="excludeEnabled" type="checkbox">
                        <span>排除電台關鍵字</span>
                    </label>
                    <input
                            id="excludeInput"
                            type="search"
                            inputmode="search"
                            autocomplete="off"
                            placeholder="例如：CRI, CNR"
                            disabled
                            >
                            <p class="filter-hint">以逗號分隔多個關鍵字；只比對電台名稱</p>
                </div>
            </div>
        </details>
    </div>

    <div id="alertBanner" class="alert-banner">
      ⚠️ 查無符合條件之電台，已自動切換顯示「全部電台清單」。
    </div>

    <div class="list-header">
      <div class="list-title" id="listTitle">電台清單</div>
      <div class="list-count" id="listCount">0 個頻率</div>
    </div>

    <div class="station-list" id="stationContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
